<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>miniread</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADElEQVR4nGNgYGAAAAAEAAH2FzhVAAAAAElFTkSuQmCC">
<script>try{localStorage.mrdTheme==='dark'&&(document.documentElement.dataset.theme='dark')}catch(_){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--nt:#d99a00;--fg:#222;--bar:#f3f3f3;--line:#ccc;--btn:#fff;--btnb:#bbb;--btnh:#eef3ff;--bfg:buttontext;--view:#cfcfcf;--side:#f7f7f7;--h4:#555;--h4b:#ddd;--pageb:#777;--err:#c4392f;--erb:#cc41360f;--t3:#6e6e6e;--ok:#2f8f55;--on:#d6e4ff;--onb:#6d94e0;--onfg:buttontext}
[data-theme=dark]{color-scheme:dark;--nt:#e8b030;--fg:#e5e5e5;--bar:#000;--line:#262626;--btn:#262626;--btnb:#000;--btnh:#404040;--bfg:#e5e5e5;--view:#141414;--side:#000;--h4:#a3a3a3;--h4b:#262626;--pageb:#404040;--err:#f1877f;--erb:#f07a7014;--t3:#8c8c8c;--ok:#4fc27e;--on:#e5e5e5;--onb:#e5e5e5;--onfg:#171717}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;font:12px/1.5 system-ui,sans-serif;color:var(--fg)}
button{font:inherit;padding:2px 6px;border:1px solid var(--btnb);border-radius:3px;background:var(--btn);color:var(--bfg);cursor:pointer}
button:hover{background:var(--btnh)}button:disabled{opacity:.4;cursor:default}button.on{background:var(--on);border-color:var(--onb);color:var(--onfg)}
input,select,textarea{font:inherit}
[data-theme=dark] input:not([type=checkbox]):not([type=file]),[data-theme=dark] select,[data-theme=dark] textarea{background:#262626;color:#f5f5f5;border:1px solid #404040;border-radius:3px}
[data-theme=dark] input:focus,[data-theme=dark] select:focus,[data-theme=dark] textarea:focus{outline:none;border-color:#a3a3a3}
[data-theme=dark] dialog{background:#171717;color:#e5e5e5;border:1px solid #404040}
kbd{font:11px ui-monospace,monospace;padding:0 4px;border:1px solid var(--line);border-radius:3px;background:var(--btn)}
#mBar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:4px 6px;background:var(--bar);border-bottom:1px solid var(--line)}
#mBar i{width:1px;height:18px;background:var(--line);margin:0 4px}
#mBar button{padding:1px 5px;border-color:transparent;background:transparent}
#mBar button:hover{background:transparent;color:var(--onb)}
#mBar button.on{background:transparent;border-color:transparent;color:var(--onb)}
#mPgN{width:46px;text-align:center}
#mPgT{color:var(--h4)}
#mMain{flex:1;display:flex;min-height:0;position:relative}
#mLink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#mLink path{fill:none;stroke:var(--nt);stroke-width:1.2;opacity:.55}
#mLink circle{fill:var(--nt);opacity:.75}
#mLink .on path{stroke-width:2;opacity:1}#mLink .on circle{opacity:1}
.hl{position:absolute;z-index:1;pointer-events:none;border-radius:2px;background:#ffd54a55;mix-blend-mode:multiply}
.hl.on{background:#ffc400a0}
#mLane{flex:1;min-height:0;position:relative;z-index:6;overflow:hidden}
#mNotes{position:absolute;left:0;right:0;top:0}
#mLeft{flex:0 0 60%;min-width:200px;display:flex}
#mViewWrap{flex:1;position:relative;display:flex;min-width:0}
#mView{flex:1;overflow:auto;background:var(--view);padding:16px}
#mHint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--h4);pointer-events:none;padding:24px}
#mHint[hidden]{display:none}
#mHint>div{border:2px dashed var(--h4b);border-radius:8px;padding:26px 34px;max-width:420px;line-height:1.6}
#mHint small{opacity:.8}
#mSplit{flex:0 0 5px;cursor:col-resize;background:var(--bar);border-left:1px solid var(--line);border-right:1px solid var(--line)}
#mThumb{display:none;width:112px;flex:none;overflow:auto;background:var(--bar);border-right:1px solid var(--line);padding:6px 6px 12px}
body.thumbs #mThumb{display:block}
.tp{width:96px;margin:0 auto 8px;cursor:pointer}
.tp .ph{background:var(--btn);outline:1px solid var(--pageb)}
.tp canvas{display:block;width:100%;height:auto;outline:1px solid var(--pageb)}
.tp b{display:block;text-align:center;font-weight:normal;font-size:10px;color:var(--h4);margin-top:2px}
.tp.cur{outline:2px solid var(--onb);outline-offset:2px}
.tp:hover .ph,.tp:hover canvas{outline-color:var(--onb)}
.page{position:relative;margin:0 auto 12px;background:#fff;outline:1px solid var(--pageb);box-shadow:0 1px 4px #0006}
.page canvas{display:block;width:100%;height:100%}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:#2f6fde55}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
#mRight{flex:1;min-width:300px;display:flex;flex-direction:column;background:var(--side)}
#mRight>details{padding:4px 8px;border-top:1px solid var(--line)}
#mRight>details>summary{cursor:pointer;color:var(--h4)}
#mRight details label{display:grid;grid-template-columns:56px 1fr;gap:6px;align-items:center;margin:3px 0}
#mRight [hidden],#mRight details label.up[hidden]{display:none}
#mRight details label.up{display:block}
#mRight details input,#mRight details select,#mRight details textarea{width:100%;min-width:0}
#mRight details input[type=checkbox]{width:auto;justify-self:start;margin:0}
#mRight .up small{display:block;margin:1px 0 2px;color:var(--h4)}
#mComp{flex:none;margin:8px;padding:6px 6px 6px 8px;border-radius:8px;background:var(--btn);box-shadow:inset 0 0 0 1px var(--btnb)}
#mComp:focus-within{box-shadow:inset 0 0 0 1px var(--onb)}
#mSrc{display:block;width:100%;min-height:44px;height:72px;padding:1px 2px;border:0;border-radius:0;background:transparent;resize:vertical}
#mOps{display:flex;align-items:center;gap:3px;margin-top:4px}
#mOps label{display:flex;align-items:center;gap:4px;color:var(--h4);font-size:11.5px}
#mClr,#mSave,#mPdf{flex:none;padding:0 6px;border-color:transparent;background:transparent;color:var(--h4);font-size:11px}
#mClr:hover,#mSave:hover,#mPdf:hover{background:var(--btnh);color:var(--fg)}
#mGo{flex:none;padding:2px 12px;border-color:transparent;border-radius:6px;background:var(--fg);color:var(--side)}
#mGo:hover{background:var(--fg);opacity:.85}
#mCnt{margin-left:auto;color:var(--t3);font-size:11px;white-space:nowrap}
.item{position:absolute;left:10px;right:10px;display:flex;flex-direction:column;padding:7px 10px;border-radius:8px;background:var(--btn);box-shadow:0 0 0 1px var(--h4b),0 1px 3px #0001}
.item[hidden]{display:none}
.item.on{box-shadow:0 0 0 1.5px var(--nt),0 2px 8px #0002}
.item .u{margin-bottom:5px;padding-left:7px;border-left:2px solid var(--line);color:var(--h4);font-size:11.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item .a{max-height:45vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.item .a.dim{color:var(--h4);font-size:12px}
.item .a.er{padding:6px 9px;border-radius:8px;background:var(--erb);box-shadow:inset 0 0 0 1px var(--btnb);color:var(--err)}
.item .mt span{margin-right:auto;overflow:hidden;text-overflow:ellipsis}
.item .mt{display:flex;align-items:center;gap:2px;margin-top:4px;color:var(--t3);font-size:11px;white-space:nowrap}
.item .rtb{flex:none;padding:0 6px;border-color:transparent;background:transparent;color:var(--h4);font-size:11px}
.item .rtb:hover{background:var(--btnh);color:var(--fg)}
.item .wt{display:flex;align-items:center;gap:6px;color:var(--h4)}
.item .wt svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;animation:mBob 1.2s ease-in-out infinite}
.item .wt .wm{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--t3)}
.item .wt .tm{margin-left:auto;color:var(--t3);font-variant-numeric:tabular-nums}
.item .sh{white-space:nowrap;background:linear-gradient(90deg,var(--t3) 0 38%,var(--fg) 50%,var(--t3) 62% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:mShim 1.7s linear infinite}
.item details{margin-bottom:6px}
.item details summary{cursor:pointer;color:var(--h4);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item details.ok>summary::before{content:'✓ ';color:var(--ok)}
.item .th{max-height:180px;overflow:auto;margin-top:3px;padding-left:8px;border-left:2px solid var(--line);font-size:11px;color:var(--h4);white-space:pre-wrap;overflow-wrap:anywhere}
@keyframes mBob{50%{transform:translateY(-2px);opacity:.55}}
@keyframes mShim{from{background-position:100% 0}to{background-position:0 0}}
@media(prefers-reduced-motion:reduce){.item .wt svg,.item .sh{animation:none}}
#mSt{height:22px;display:flex;align-items:center;gap:18px;padding:2px 2px 2px 8px;background:var(--bar);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden}
#mMsg{min-width:0;overflow:hidden;text-overflow:ellipsis}
#mSel{margin-left:auto;color:var(--h4)}
#mSt button{flex:none;padding:0 8px;line-height:16px;border-color:transparent;background:transparent}
#mSt button:hover{background:var(--btnh)}
#mHelp{padding:0;max-width:min(400px,96vw);max-height:92vh;border:1px solid var(--line)}
#mHelp form{padding:12px 16px;font-size:12.5px;line-height:1.45}
#mHelp h3{margin:0 0 6px}
#mHelp dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:0}
#mHelp dd{margin:0}
#mHelp .ft{display:flex;align-items:center;margin:8px 0 0}
#mHelp .ft button{margin-left:auto}
</style>
</head>
<body>
<div id="mBar">
<button data-a="thumbs" title="Show or hide page thumbnails">Pages</button>
<button data-a="open" title="Open a PDF, with its .miniread.json notes if you have them (or drop them on the viewer)">Open…</button>
<input type="file" id="mFile" accept="application/pdf,.pdf,.json" multiple hidden>
<i></i>
<button data-a="first" title="First page">«</button><button data-a="prev" title="Previous page">‹</button>
<input id="mPgN" type="number" min="1" value="1" title="Page number; Enter to go">
<span id="mPgT" title="Pages in this PDF">–</span>
<button data-a="next" title="Next page">›</button><button data-a="last" title="Last page">»</button>
<i></i>
<button data-a="out" title="Zoom out (−)">−</button><span id="mZoomB" title="Zoom level">100%</span><button data-a="in" title="Zoom in (+)">＋</button>
<button data-a="fit" title="Fit the page width to the window (0)">Fit</button>
<i></i><button data-a="help" title="Shortcuts (?)">Help</button>
</div>
<div id="mMain">
<div id="mLeft"><div id="mThumb"></div><div id="mViewWrap"><div id="mView"></div>
<div id="mHint"><div><b>Drop a PDF here</b>, or choose Open… above<br><small>Selected text is translated into a note on the right, linked to where it came from.</small></div></div>
</div></div>
<div id="mSplit" title="Drag to resize the panes"></div>
<div id="mRight">
<div id="mLane"><div id="mNotes"></div></div>
<details id="mCfg"><summary title="Your key stays in this browser">AI settings</summary>
<label>Provider<select id="mProv" title="AI provider"><option value="Glm">GLM</option><option value="Ds">DeepSeek</option></select></label>
<label>Model<select id="mModel" title="Model"></select></label>
<label>Think<select id="mThink" title="Reasoning effort: how hard the model thinks before answering"><option value="low">Low</option><option value="high">High</option><option value="max">Max</option></select></label>
<label>Key<input id="mKey" type="password" autocomplete="off" placeholder="API key" spellcheck="false"></label>
<label>URL<input id="mEp" spellcheck="false"></label>
<label id="mRlyL" hidden title="GLM blocks browser requests from this site (CORS). The relay is svguest's Cloudflare Worker: your key and the text pass through it, nothing is stored">Relay<input type="checkbox" id="mRly"></label>
</details>
<details><summary>Language</summary>
<label>Into<select id="mLang"></select></label>
<label class="up" hidden>Prompt<small>{lang} is replaced by the target language</small><textarea id="mPrompt" rows="4" spellcheck="false"></textarea></label>
</details>
<div id="mComp">
<textarea id="mSrc" spellcheck="false" placeholder="Select text in the PDF, or paste it here — ⌘/Ctrl+Enter translates"></textarea>
<div id="mOps">
<label title="Translate as soon as text is selected in the PDF"><input type="checkbox" id="mAuto">Auto</label>
<button id="mClr" title="Remove all translations and highlights">Clear</button>
<button id="mSave" title="Save the notes as a .miniread.json file to keep beside the PDF (⌘/Ctrl+S); open it with the PDF to bring them back">Save</button>
<button id="mPdf" title="Save a copy of the PDF with the highlights and translations as comments (Preview, Acrobat); open that copy in miniread to bring the notes back">Save PDF</button>
<span id="mCnt"></span>
<button id="mGo" title="⌘/Ctrl+Enter">Translate</button>
</div>
</div>
</div>
<svg id="mLink"></svg>
</div>
<div id="mSt"><span id="mMsg"></span><span id="mSel"></span><button data-a="theme">Theme</button></div>
<dialog id="mHelp"><form method="dialog"><h3>Shortcuts</h3><dl>
<dt><kbd>?</kbd></dt><dd>This help</dd>
<dt><kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>Enter</kbd></dt><dd>Translate</dd>
<dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>Step pages (<kbd>Home</kbd>/<kbd>End</kbd>: first/last)</dd>
<dt><kbd>↑</kbd> <kbd>↓</kbd> <kbd>Space</kbd></dt><dd>Scroll</dd>
<dt><kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd></dt><dd>Zoom (<kbd>Ctrl</kbd>+wheel too)</dd>
</dl><p class="ft"><button value="">Close</button></p></form></dialog>
<script>
'use strict';
const $=i=>document.getElementById(i),V=$('mView'),ls=(k,v)=>{try{return v==null?localStorage[k]:localStorage[k]=v}catch(_){}};
const el=(t,c,x)=>{const e=document.createElement(t);c&&(e.className=c);x!=null&&(e.textContent=x);return e},
  btn=(t,ti)=>{const e=el('button',0,t);ti&&(e.title=ti);return e},msg=t=>$('mMsg').textContent=t||'';
const nl=n=>n.toLocaleString('en');

// ---------- AI settings (GLM / DeepSeek) ----------
const AI={Glm:['https://open.bigmodel.cn/api/paas/v4/chat/completions','glm-5.3','glm-5.3-flash'],Ds:['https://api.deepseek.com/chat/completions','deepseek-v4-pro','deepseek-flash']},
  aiF=[['mKey','Key'],['mModel','Model'],['mEp','Ep']],
  // GLM relay (same Worker as svguest): opt-in, only on GitHub Pages, only the two official GLM URLs
  RLY='https://svguest-glm.jieqiang-he-dawn.workers.dev',RLYR={'https://open.bigmodel.cn/api/paas/v4/chat/completions':'standard','https://open.bigmodel.cn/api/coding/paas/v4/chat/completions':'coding'},
  rlyOk=()=>location.origin==='https://jieqianghe.github.io'&&$('mProv').value==='Glm',
  aiLoad=()=>{const p=$('mProv').value,[u,...ms]=AI[p],m=ls('mrd'+p+'Model');
    $('mModel').replaceChildren(...ms.map(x=>new Option(x,x)));
    $('mModel').value=ms.includes(m)?m:ms[0];
    $('mKey').value=ls('mrd'+p+'Key')||'';$('mEp').value=ls('mrd'+p+'Ep')||u;$('mRlyL').hidden=!rlyOk()};
for(const[i,k]of[['mProv','mrdAi'],['mThink','mrdThink']]){const e=$(i),v=ls(k);v&&[...e.options].some(o=>o.value===v)&&(e.value=v);e.onchange=()=>{ls(k,e.value);i==='mProv'&&aiLoad()}}
for(const[i,k]of aiF)$(i).onchange=()=>ls('mrd'+$('mProv').value+k,$(i).value.trim());
$('mRly').checked=ls('mrdGlmRelay')!=='0';$('mRly').onchange=()=>ls('mrdGlmRelay',$('mRly').checked?'1':'0');
aiLoad();$('mCfg').open=!$('mKey').value;

// ---------- language, prompt ----------
const LANGS=['Simplified Chinese','English'],
  PROMPT0='Translate the academic text given by the user into {lang}. Output only the translation, with accurate terminology and fluent prose. Keep gene names, Latin species names, abbreviations, formulas and literature citation marks unchanged.';
$('mLang').replaceChildren(...LANGS.map(l=>new Option(l,l)));
$('mLang').value=LANGS.includes(ls('mrdLang'))?ls('mrdLang'):LANGS[0];
$('mAuto').checked=ls('mrdAuto')!=='0';
$('mPrompt').value=ls('mrdPrompt')||PROMPT0;
$('mLang').onchange=()=>ls('mrdLang',$('mLang').value);
$('mPrompt').onchange=()=>ls('mrdPrompt',$('mPrompt').value);
$('mAuto').onchange=()=>ls('mrdAuto',$('mAuto').checked?'1':'0');

// ---------- translate ----------
const cnt=()=>$('mCnt').textContent=nl($('mSrc').value.length)+' chars';
const glmJ={},  // GLM endpoints that answered with plain JSON instead of a stream: asked without stream next time
  MARK='<svg viewBox="6 4.75 228 228"><path d="M29 85.86L113 36.14M127 36.14L211 85.86" stroke-width="20"/><path d="M15 83h14v14H15zM113 25h14v14h-14zM211 83h14v14h-14z" stroke-width="14"/><path d="M98 111V101Q98 95 104 95H136Q142 95 142 101V111" stroke-width="16"/><rect x="44" y="111" width="152" height="100" rx="5" stroke-width="16"/></svg>',
  apiMsg=t=>{try{const j=JSON.parse(t),e=j.error||j;return(e.code?'['+e.code+'] ':'')+(e.message||t)}catch(_){return t}};
// ask(): one streamed request, like svguest's call() — GLM falls back to a single JSON reply when the endpoint
// will not stream; finish_reason:'length' comes back as cut
async function ask(model,msgs,myAc,ui){
  const p=$('mProv').value,u=$('mEp').value.trim(),key=$('mKey').value.trim(),rly=rlyOk()&&$('mRly').checked;
  if(rly&&!RLYR[u])throw Error('The relay only forwards the official GLM URL (standard or Coding Plan)');
  const post=b=>fetch(rly?RLY+'/glm/'+RLYR[u]:u,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},signal:myAc.signal,...(rly&&{credentials:'omit',redirect:'error'}),body:JSON.stringify(b)}),
    body={model,messages:msgs,stream:true,max_tokens:32768,thinking:{type:'enabled'},reasoning_effort:$('mThink').value};
  p==='Glm'&&glmJ[u]&&(body.stream=false);
  let r;
  try{r=await post(body)}
  catch(e){
    if(e.name!=='TypeError'||myAc.signal.aborted)throw e;
    if(rly)throw Error('The GLM relay could not be reached. Check the network, or turn Relay off. '+e.message);
    if(p!=='Glm'||!body.stream)throw Error('The API could not be reached. Check the network and the URL'+(p==='Glm'&&rlyOk()?' — or turn on Relay in AI settings':'')+'. '+e.message);
    msg('GLM streaming could not open; waiting for a single reply…');glmJ[u]=1;body.stream=false;
    try{r=await post(body)}catch(x){if(x.name==='TypeError'&&!myAc.signal.aborted)throw Error('GLM could not be reached. Check the network and the URL. '+x.message);throw x}
  }
  if(!r.ok)throw Error(`${r.status} ${apiMsg(await r.text())}`.slice(0,300));
  if(p==='Glm'&&!/text\/event-stream/i.test(r.headers.get('Content-Type')||'')){
    const t=await r.text();let j;try{j=JSON.parse(t)}catch(_){}
    if(j?.error)throw Error(apiMsg(t));
    glmJ[u]=1;const ch=j?.choices?.[0],c=ch?.message;
    if(!c)throw Error('GLM sent an unexpected reply — check the URL and key');
    c.reasoning_content&&ui.think(c.reasoning_content);c.content&&ui.text(c.content);
    return{out:c.content||'',cut:ch.finish_reason==='length'?1:0}
  }
  let out='',cut=0;
  const rd=r.body.pipeThrough(new TextDecoderStream()).getReader();let buf='';
  const on=l=>{const d=l.startsWith('data:')&&l.slice(5).trim();if(!d||d==='[DONE]')return;let j;try{j=JSON.parse(d)}catch{return}
    if(j.error)throw Error(j.error.message||JSON.stringify(j.error));
    const ch=j.choices?.[0]||{},c=ch.delta||{};
    ch.finish_reason==='length'&&(cut=1);
    c.reasoning_content&&ui.think(c.reasoning_content);c.content&&(out+=c.content,ui.text(out))};
  for(;;){const{value,done}=await rd.read();if(done)break;const ls2=(buf+=value).split('\n');buf=ls2.pop();ls2.forEach(on)}
  on(buf);
  return{out,cut}
}
// ---------- notes: each translation is a bubble in the right lane, linked by a line to its highlight in the PDF ----------
// o={rs:[[page,x,y,w,h]] in PDF units (null: pasted text), fy (where a pasted note sits), el, ac}; nAct is aligned to its anchor,
// the others are pushed up/down so no two bubbles overlap
const N=[],NS=$('mNotes'),LK=$('mLink');let nAct=null,nLast=null,nRaf=0,selA=null;
const sched=()=>nRaf||(nRaf=requestAnimationFrame(frame)),ro=new ResizeObserver(sched),
  pgOf=n=>V.querySelector(`.page[data-n="${n}"]`),
  docH=()=>{const p=V.lastElementChild;return p?p.offsetTop+p.offsetHeight:0},
